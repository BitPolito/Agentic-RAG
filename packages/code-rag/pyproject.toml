[project]
name = "agentic-rag-code"
version = "0.0.0"
description = "AST-aware code retrieval extension for the agentic-rag engine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["agentic-rag"]

[tool.uv.sources]
agentic-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag_code"]
